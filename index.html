<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Masquerade</title>
  <!-- Installable app (Add to Home Screen) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <meta name="theme-color" content="#140a0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Masquerade">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ballroom backdrop -->
  <div class="backdrop" aria-hidden="true">
    <div class="curtain curtain-left"></div>
    <div class="curtain curtain-right"></div>
    <div class="window"></div>
    <div class="candles">
      <span class="candle c1"><i></i></span>
      <span class="candle c2"><i></i></span>
    </div>
    <div class="vignette"></div>
  </div>

  <main id="app"></main>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status"></div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="words.js"></script>
  <script src="masks.js"></script>
  <script src="i18n.js"></script>
  <script src="game.js"></script>
</body>
</html>
